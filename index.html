<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfolio profesional — Backend Developer & QA Automation Engineer. Pengalaman Laravel, API, test automation, dan dampak bisnis terukur.">
  <meta name="keywords" content="portfolio, backend developer, Laravel, QA automation, PHP, REST API">
  <meta name="author" content="Farhan">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Farhan — Backend Developer & QA Automation Engineer">
  <meta property="og:description" content="Portfolio profesional dengan pengalaman scalable applications, API integrations, dan automated testing.">
  <meta property="og:image" content="assets/profile/profile.png">
  <meta property="og:locale" content="id_ID">
  <meta property="og:locale:alternate" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <title>Farhan — Backend Developer & QA Automation Engineer</title>
  <link rel="icon" href="assets/profile/profile.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="application/ld+json" id="structured-data"></script>
</head>
<body class="portfolio-body">
  <a class="skip-link" href="#main" data-i18n="skipLink">Lewati ke konten utama</a>

  <div class="scroll-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progress baca"></div>

  <header class="site-header" id="site-header">
    <div class="header-shell">
      <div class="container header-inner">
        <a href="#hero" class="logo-brand" id="logo-brand" aria-label="Beranda">
          <span class="logo-mark" id="logo-mark" aria-hidden="true">FR</span>
          <span class="logo-text">
            <span class="logo-name" id="logo-name">Farhan</span>
            <span class="logo-role" id="logo-role">Software Engineer</span>
          </span>
        </a>

        <nav class="site-nav" id="site-nav" aria-label="Navigasi utama">
          <ul class="nav-menu" id="nav-menu"></ul>
        </nav>

        <div class="header-actions">
          <div class="header-tools">
            <button type="button" class="tool-btn" id="lang-toggle" aria-label="Ganti bahasa">
              <span class="tool-btn-label" id="lang-toggle-label">ID</span>
            </button>
            <button type="button" class="tool-btn" id="theme-toggle" aria-label="Ganti tema">
              <span class="theme-icon theme-icon-light" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
              </span>
              <span class="theme-icon theme-icon-dark" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              </span>
            </button>
          </div>
          <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav-menu">
            <span class="nav-toggle-icon" aria-hidden="true">
              <span class="nav-toggle-bar"></span>
              <span class="nav-toggle-bar"></span>
            </span>
            <span class="nav-toggle-label" id="nav-toggle-label">Menu</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main id="main">
    <section id="hero" class="section hero" aria-labelledby="hero-title"></section>
    <section id="summary" class="section" aria-labelledby="summary-title"></section>
    <section id="recruiter" class="section section-alt" aria-labelledby="recruiter-title"></section>
    <section id="metrics" class="section" aria-labelledby="metrics-title"></section>
    <section id="skills" class="section section-alt" aria-labelledby="skills-title"></section>
    <section id="proficiency" class="section" aria-labelledby="proficiency-title"></section>
    <section id="experience" class="section section-alt" aria-labelledby="experience-title"></section>
    <section id="services" class="section" aria-labelledby="services-title"></section>
    <section id="projects" class="section section-alt" aria-labelledby="projects-title"></section>
    <section id="featured-projects" class="section" aria-labelledby="featured-projects-title"></section>
    <section id="case-studies" class="section section-alt" aria-labelledby="case-studies-title"></section>
    <section id="timeline" class="section" aria-labelledby="timeline-title"></section>
    <section id="certifications" class="section section-alt" aria-labelledby="certifications-title"></section>
    <section id="education" class="section" aria-labelledby="education-title"></section>
    <section id="testimonials" class="section section-alt" aria-labelledby="testimonials-title"></section>
    <section id="branding" class="section" aria-labelledby="branding-title"></section>
    <section id="resume" class="section section-alt" aria-labelledby="resume-title"></section>
    <section id="cta-recruiter" class="section cta-recruiter" aria-labelledby="cta-recruiter-title"></section>
    <section id="contact" class="section contact-section section-alt" aria-labelledby="contact-title"></section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-copy" id="footer-copy"></p>
      <button type="button" class="btn btn-ghost btn-sm" id="vcard-btn" data-i18n="downloadVcard">Unduh vCard</button>
    </div>
  </footer>

  <button type="button" class="back-to-top" id="back-to-top" aria-label="Kembali ke atas" hidden>↑</button>

  <div class="mobile-menu" id="mobile-menu" aria-hidden="true">
    <div class="mobile-menu__backdrop" id="nav-overlay" hidden></div>
    <aside class="mobile-menu__sheet" role="dialog" aria-modal="true" aria-labelledby="mobile-menu-title">
      <div class="mobile-menu__handle" aria-hidden="true"></div>
      <div class="mobile-menu__header">
        <p class="mobile-menu__title" id="mobile-menu-title">Menu</p>
        <button type="button" class="mobile-menu__close" id="nav-close" aria-label="Tutup menu">
          <span aria-hidden="true">×</span>
        </button>
      </div>
      <nav class="mobile-menu__nav" aria-label="Navigasi mobile">
        <ul class="mobile-menu__list" id="nav-menu-mobile"></ul>
      </nav>
      <a href="#contact" class="btn btn-primary btn-glow mobile-menu__cta" id="mobile-menu-cta">Hubungi</a>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/app.js" defer></script>

</html>
